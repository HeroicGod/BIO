<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Premium | Portal Resmi</title>
    
    <!-- Menggunakan font 'Outfit' untuk kesan modern, elegan dan tidak kaku -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome untuk Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS untuk styling responsif -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Konfigurasi warna kustom Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            black: '#050000',
                            darkred: '#3a0000',
                            red: '#cc0000',
                            lightred: '#ff3333'
                        }
                    },
                    animation: {
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #050000;
            color: white;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Kanvas untuk background interaktif */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        /* Orb glowing di belakang konten */
        .glow-orb {
            position: fixed;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(204,0,0,0.15) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: -1;
            transition: transform 0.2s ease-out;
        }

        /* Styling Kartu Menu (Glassmorphism & Red Accents) */
        .glass-card {
            background: rgba(20, 0, 0, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(204, 0, 0, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            transform-style: preserve-3d;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        /* Efek kilatan cahaya saat hover */
        .glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, transparent, rgba(255, 51, 51, 0.1), transparent);
            transform: skewX(-20deg);
            transition: left 0.7s;
            z-index: 1;
            pointer-events: none;
        }

        .glass-card:hover::before {
            left: 200%;
        }

        .glass-card:hover {
            border-color: rgba(204, 0, 0, 0.6);
            box-shadow: 0 15px 35px rgba(204, 0, 0, 0.2);
            transform: translateY(-5px) scale(1.02);
        }

        /* Animasi masuk (Scroll Reveal) */
        .reveal-item {
            opacity: 0;
            transform: translateY(40px) scale(0.95);
            transition: all 0.8s cubic-bezier(0.5, 0, 0, 1);
        }

        .reveal-item.active {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* Kontainer Media (Gambar/Video) */
        .media-container {
            aspect-ratio: 16 / 9;
            overflow: hidden;
            border-bottom: 1px solid rgba(204, 0, 0, 0.2);
            position: relative;
        }
        
        .media-container img, .media-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .glass-card:hover .media-container img,
        .glass-card:hover .media-container video {
            transform: scale(1.05);
        }

        /* Badge/Label */
        .badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: linear-gradient(135deg, #cc0000, #5a0000);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 2;
        }
    </style>
</head>
<body class="antialiased selection:bg-brand-red selection:text-white flex flex-col min-h-screen">

    <canvas id="bg-canvas"></canvas>
    <div class="glow-orb" id="cursor-glow"></div>

    <!-- Kontainer Utama -->
    <main class="flex-grow w-full max-w-2xl mx-auto px-4 py-12 flex flex-col relative z-10">
        
        <header class="flex flex-col items-center text-center mb-10 reveal-item active" style="transition-delay: 0.1s;">
            <!-- Avatar/Logo -->
            <div class="relative w-28 h-28 mb-4 animate-float">
                <div class="absolute inset-0 bg-brand-red rounded-full animate-pulse-slow blur-md opacity-50"></div>
                <img src="aset/icon.jpg" 
                     alt="Profile Picture" 
                     class="relative w-full h-full object-cover rounded-full border-2 border-brand-red/50 shadow-[0_0_20px_rgba(204,0,0,0.3)]">
            </div>
            
            <!-- Nama / Title -->
            <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight mb-2 bg-clip-text text-transparent bg-gradient-to-r from-white via-gray-200 to-brand-lightred">
                HeroixProject
            </h1>
            
            <!-- Deskripsi Singkat -->
            <p class="text-gray-400 text-sm md:text-base font-light max-w-md">
                Pilih destinasi Anda di bawah ini. Selalu cek ketersediaan produk dikomunitas telegram resmi kami.
            </p>
        </header>

        <!-- Bagian ini akan diisi secara otomatis oleh JavaScript -->
        <div id="menu-container" class="flex flex-col gap-6 w-full pb-10">
            <!-- Loading placeholder (hilang saat JS berjalan) -->
            <div class="text-center text-brand-red animate-pulse">Memuat akses premium...</div>
        </div>
        
    </main>

    <!-- Footer Statis -->
    <footer class="mt-auto py-6 text-center text-xs text-gray-600 relative z-10">
        <p>&copy; 2026 Portal Resmi. All rights reserved.</p>
    </footer>

    <script>
        /* ====================================================================
           BAGIAN 1: PENGATURAN MENU / LINK (EDIT DI SINI)
           ====================================================================
           Cara menambah menu:
           Salin salah satu blok { ... }, tempel di bawahnya (sebelum tutup kurung siku ] ).
           
           Penjelasan properti:
           - title : Judul menu besar
           - desc  : Penjelasan singkat menu
           - type  : Gunakan "image" untuk gambar, atau "video" untuk video bergerak
           - src   : Link URL gambar (JPG/PNG) atau URL video (MP4). Format lanskap direkomendasikan.
           - url   : Link tujuan saat kartu diklik (misal link telegram, link shopee, dll)
           - badge : Teks pita kecil di pojok kanan atas (kosongkan "" jika tidak ingin pakai)
           - icon  : Class icon dari FontAwesome (contoh: "fa-brands fa-telegram")
        ==================================================================== */
        
        const menuData = [
            {
                title: "Grup Telegram",
                desc: "Jalur komunikasi utama. Dapatkan update status produk, diskusi market, dan bocoran informasi eksklusif setiap harinya.",
                type: "image",
                src: "aset/Grup.jpg", 
                url: "https://t.me/+sxjWNLWe6yZkNTNl",
                badge: "🔥 Akses Utama",
                icon: "fa-brands fa-telegram"
            },
            {
                title: "Market Cheat Premium",
                desc: "Akses langsung ke seluruh produk digital dan fisik dengan harga yang terjangkau. Cek ketersediaan di sini.",
                type: "images",
                src: "aset/Market.jpg", // Contoh video abstrak merah/hitam
                url: "https://her-ox-store.vercel.app/",
                badge: "Buka 24 Jam",
                icon: "fa-solid fa-store"
            },
            {
                title: "Info Cheat Free",
                desc: "Akses Cheat Free Tier. Kami harap anda tetap melakukan riset mendalam terkait produk yang tersedia. Segala resiko terkait produk ini murni atas pemahaman user",
                type: "image",
                src: "aset/info.jpg",
                url: "https://projectfreetier.vercel.app/",
                badge: "Akses Free",
                icon: "fa-solid fa-store"
            }
        ];

        /* ====================================================================
           BAGIAN 2: RENDER MENU KE HALAMAN
           ==================================================================== */
        const menuContainer = document.getElementById('menu-container');
        
        function renderMenus() {
            menuContainer.innerHTML = ''; // Bersihkan loading
            
            menuData.forEach((menu, index) => {
                // Delay animasi bertingkat berdasarkan urutan
                const delay = (index + 1) * 0.15;
                
                // Render Media (Gambar atau Video)
                let mediaHTML = '';
                if (menu.type === 'video') {
                    mediaHTML = `<video autoplay loop muted playsinline class="pointer-events-none"><source src="${menu.src}" type="video/mp4"></video>`;
                } else {
                    mediaHTML = `<img src="${menu.src}" alt="${menu.title}" loading="lazy">`;
                }

                // Render Badge
                let badgeHTML = menu.badge ? `<div class="badge">${menu.badge}</div>` : '';

                // Bangun Kartu HTML
                const cardHTML = `
                    <a href="${menu.url}" target="_blank" rel="noopener noreferrer" 
                       class="glass-card rounded-2xl block reveal-item group cursor-pointer text-left" 
                       style="transition-delay: ${delay}s;"
                       data-tilt>
                        
                        <!-- Area Lanskap -->
                        <div class="media-container relative">
                            ${badgeHTML}
                            ${mediaHTML}
                            <!-- Overlay gradasi hitam ke bawah agar teks lebih terbaca -->
                            <div class="absolute inset-0 bg-gradient-to-t from-[#0a0000] via-transparent to-transparent opacity-90"></div>
                        </div>
                        
                        <!-- Area Teks -->
                        <div class="p-5 md:p-6 relative z-10">
                            <div class="flex items-center gap-3 mb-2">
                                <div class="w-10 h-10 rounded-full bg-brand-red/20 border border-brand-red/40 flex items-center justify-center text-brand-lightred group-hover:scale-110 transition-transform shadow-[0_0_10px_rgba(204,0,0,0.2)]">
                                    <i class="${menu.icon} text-lg"></i>
                                </div>
                                <h2 class="text-xl font-bold text-white group-hover:text-brand-lightred transition-colors">${menu.title}</h2>
                            </div>
                            <p class="text-gray-300 text-sm leading-relaxed ml-13">
                                ${menu.desc}
                            </p>
                        </div>
                    </a>
                `;
                
                menuContainer.insertAdjacentHTML('beforeend', cardHTML);
            });
            
            // Panggil observer setelah elemen dirender
            initScrollReveal();
        }

        /* ====================================================================
           BAGIAN 3: ANIMASI SCROLL & TILT 3D
           ==================================================================== */
        function initScrollReveal() {
            const reveals = document.querySelectorAll('.reveal-item');
            const revealOptions = {
                threshold: 0.1,
                rootMargin: "0px 0px -50px 0px"
            };

            const revealOnScroll = new IntersectionObserver(function(entries, observer) {
                entries.forEach(entry => {
                    if (!entry.isIntersecting) return;
                    entry.target.classList.add('active');
                    observer.unobserve(entry.target);
                });
            }, revealOptions);

            reveals.forEach(reveal => {
                revealOnScroll.observe(reveal);
            });
        }

        // Efek Tilt 3D sederhana saat mouse bergerak di atas kartu
        document.addEventListener('mousemove', (e) => {
            const cards = document.querySelectorAll('[data-tilt]');
            cards.forEach(card => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left; // x position within the element.
                const y = e.clientY - rect.top;  // y position within the element.
                
                // Hanya jalankan jika kursor berada di area kartu
                if (x > 0 && x < rect.width && y > 0 && y < rect.height) {
                    const xPct = (x / rect.width - 0.5) * 10; // Max rotasi 10 deg
                    const yPct = (y / rect.height - 0.5) * -10;
                    card.style.transform = `perspective(1000px) rotateY(${xPct}deg) rotateX(${yPct}deg) translateY(-5px) scale(1.02)`;
                } else {
                    card.style.transform = `perspective(1000px) rotateY(0deg) rotateX(0deg)`;
                }
            });
        });

        /* ====================================================================
           BAGIAN 4: BACKGROUND KANVAS INTERAKTIF (PARTIKEL MERAH)
           ==================================================================== */
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];
        
        // Kursor untuk interaksi background
        let mouse = { x: null, y: null, radius: 100 };
        const glowOrb = document.getElementById('cursor-glow');

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.x;
            mouse.y = e.y;
            // Pindahkan glow orb
            glowOrb.style.left = (e.x - 150) + 'px';
            glowOrb.style.top = (e.y - 150) + 'px';
        });

        // Hapus interaksi mouse jika keluar jendela
        window.addEventListener('mouseout', () => {
            mouse.x = null;
            mouse.y = null;
        });

        function resizeCanvas() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            initParticles();
        }

        window.addEventListener('resize', resizeCanvas);

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2 + 0.5;
                this.baseX = this.x;
                this.baseY = this.y;
                this.density = (Math.random() * 20) + 1;
                // Gerakan alami lambat
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
            }
            
            draw() {
                ctx.fillStyle = 'rgba(204, 0, 0, 0.6)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.closePath();
                ctx.fill();
            }
            
            update() {
                // Gerakan dasar
                this.x += this.vx;
                this.y += this.vy;

                // Pantulan dinding
                if(this.x < 0 || this.x > width) this.vx = -this.vx;
                if(this.y < 0 || this.y > height) this.vy = -this.vy;

                // Interaksi mouse
                if (mouse.x != null) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    let forceDirectionX = dx / distance;
                    let forceDirectionY = dy / distance;
                    let maxDistance = mouse.radius;
                    let force = (maxDistance - distance) / maxDistance;
                    let directionX = forceDirectionX * force * this.density;
                    let directionY = forceDirectionY * force * this.density;

                    if (distance < mouse.radius) {
                        this.x -= directionX;
                        this.y -= directionY;
                    }
                }
            }
        }

        function initParticles() {
            particles = [];
            // Sesuaikan jumlah partikel berdasarkan lebar layar agar tidak lag di HP
            let numberOfParticles = (width * height) / 15000;
            for (let i = 0; i < numberOfParticles; i++) {
                particles.push(new Particle());
            }
        }

        function animateCanvas() {
            ctx.clearRect(0, 0, width, height);
            
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
                
                // Gambar garis antar partikel
                for (let j = i; j < particles.length; j++) {
                    let dx = particles[i].x - particles[j].x;
                    let dy = particles[i].y - particles[j].y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < 120) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(204, 0, 0, ${0.1 - distance/1200})`;
                        ctx.lineWidth = 1;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                        ctx.closePath();
                    }
                }
            }
            requestAnimationFrame(animateCanvas);
        }

        // Inisialisasi semuanya saat halaman dimuat
        window.onload = () => {
            renderMenus();
            resizeCanvas();
            animateCanvas();
        };
    </script>
</body>
</html>
